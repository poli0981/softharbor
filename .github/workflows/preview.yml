# docs/12 §3 — versioned preview per PR.
#
# Same-repo PRs only: `pull_request` does not expose secrets to forks, so a
# fork PR would fail rather than leak. Fork PRs here are data PRs that do not
# need a preview anyway.
name: preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
      - uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.upload.outputs.deployment-url }}`;
            if (!url) return;
            // Preview URLs are unlisted and carry no sitemap; never link one
            // publicly except here (docs/16 §3).
            github.rest.issues.createComment({ ...context.repo,
              issue_number: context.issue.number,
              body: `🔍 Preview: ${url}` });
