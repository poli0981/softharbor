# docs/12 §2 — tagged release → Discord.
#
# Scope note: announce-release.yml reaches DISCORD ONLY. The multi-platform
# notify.py cross-poster consumes /rss.xml on its own cron in its own repo
# (docs/03 §7, docs/13 §5), so per-app announcements need no workflow here —
# only a valid, deterministic feed.
name: notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re-)announce, e.g. v1.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    uses: poli0981/.github/.github/workflows/announce-release.yml@main
    with:
      # The reusable workflow reads `tag_override`, falling back to the
      # release event's tag. This input was never passed before, so every
      # manual re-run died with "No release tag available."
      tag_override: ${{ inputs.tag || '' }}
    # Only what the announcement needs, instead of `secrets: inherit`
    # handing every repository secret to code tracked at @main.
    secrets:
      DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
