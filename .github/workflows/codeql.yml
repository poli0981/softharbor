# docs/12 §2. reusable-codeql.yml DOES exist in the ops repo (verified).
name: codeql

on:
  push:
    branches: [main]
  # `pull_request` is REQUIRED, not optional. Branch protection lists
  # `codeql / Analyze (javascript-typescript)` as a required status check, and
  # a required check that the workflow never produces on a PR is unsatisfiable
  # — it deadlocks the repo: no PR can ever merge (hit 2026-07-30).
  #
  # It is also the point of the tool. Scanning only after the merge tells you
  # about a vulnerability that is already on main.
  pull_request:
  schedule:
    - cron: '31 3 * * 1'

# Required matrix — security-events: write is what lets results upload.
# Must be a SUPERSET of what the reusable workflow's jobs declare — a called
# workflow cannot request a permission the caller lacks, and the run is
# rejected at startup if it tries. `packages: read` is the easy one to miss:
# it is there so CodeQL can fetch internal query packs.
permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  codeql:
    uses: poli0981/.github/.github/workflows/reusable-codeql.yml@main
    with:
      # A JSON ARRAY STRING, not a bare value — the reusable workflow feeds it
      # to fromJSON() for its matrix. `javascript-typescript` on its own throws
      # and the run dies with startup_failure before any step executes.
      languages: '["javascript-typescript"]'
