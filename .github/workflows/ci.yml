# docs/12 §2 — self-contained, deliberately.
#
# This called `poli0981/.github` → `reusable-web-react.yml` and every run ended
# in `startup_failure`. Two reasons, both worth recording:
#
#  1. That workflow's Pages-deploy job declares `pages: write` and
#     `id-token: write`. A called workflow may not request permissions the
#     caller lacks, so GitHub rejects the ENTIRE run before anything executes —
#     even though the job is skipped by `deploy-pages: false`. Granting them
#     would mean handing a Workers-deployed site the ability to mint OIDC
#     tokens it never uses.
#
#  2. It runs lint / typecheck / test only *if a matching package script
#     exists*. Rename a script and CI quietly stops checking while still going
#     green. This project's gates ARE the product — and this repo has already
#     shipped four separate silent no-ops (a dead set:html lint rule, workbox
#     globs matching nothing, an unregistered service worker, CSP-dropped
#     inline styles). A silently-skipping CI is the wrong tool here.
#
# The duplicated "logic" is a handful of pnpm invocations. That is a fair
# price for a gate that fails loudly.
#
# Every `uses:` is pinned to a full commit SHA with the release tag in a
# comment (SonarCloud githubactions:S7637). Dependabot's github-actions
# ecosystem bumps the SHA and the comment together.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Lets quarantine.yml run the required checks on the PR it opens: a PR
  # created with GITHUB_TOKEN triggers no `pull_request` workflows, but a
  # `workflow_dispatch` is the documented exception (docs/12 §4).
  workflow_dispatch:

# Explicit least privilege. This repository's default workflow token is
# read-WRITE (Settings → Actions → Workflow permissions), so a workflow
# without this block would get far more than it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `version:` — the action reads package.json `packageManager`
      # (pnpm@11.x), so CI, Dependabot, Workers Builds and laptops all run the
      # same pnpm. 6.0.10+ bootstraps with pnpm 11, which is what silenced the
      # "pnpm v10 installation layout at PNPM_HOME" warning on every run.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm lint
      - name: Types
        run: pnpm check
      # `coverage` IS the unit run (vitest run --coverage): one pass, and it
      # fails below the thresholds in vitest.config.ts.
      - name: Unit tests (with coverage thresholds)
        run: pnpm coverage
      # `pnpm build` is the SAME command Cloudflare Workers Builds runs, and it
      # carries its own gates: data + i18n before `astro build`, the CSP and
      # service-worker checks on dist/ after it (package.json). Running the
      # composite here means CI and production can never diverge on what
      # "a good build" means.
      - name: Build (with data, i18n, CSP and service-worker gates)
        run: pnpm build
      # Bundles worker/ and validates wrangler.jsonc (bindings, assets,
      # run_worker_first) exactly as Workers Builds will, without credentials
      # or a deploy. A config error then fails here instead of in production.
      - name: Worker bundle (wrangler deploy --dry-run)
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Dead code
        run: pnpm knip

      # End-to-end on the build above (docs/11): every page type in both
      # locales and colour schemes, desktop + mobile, failing on any console
      # error, CSP violation or serious axe finding. The browser download is
      # ~150 MB and versioned with @playwright/test, so it is cached per
      # version; on a hit only the OS libraries still need installing.
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: End-to-end (Playwright + axe on the built site)
        run: pnpm e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changed-links step diffs against the PR base
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Data rules (L2)
        run: pnpm validate:data
      - name: EN/VI key parity (hard rule 6)
        run: pnpm i18n:check

      # The action lives in a SUBDIRECTORY of the repo and there is no rolling
      # `v2` tag — only full versions. `…/osv-scanner-action@v2` does not
      # resolve.
      - name: Vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
      - name: Audit production deps
        run: pnpm audit --prod

      # PR-time link check over changed data files only; link-check.yml owns
      # the weekly full sweep (docs/12 §5). git runs HERE, under pipefail, so a
      # failed diff stops the job instead of silently widening the sweep.
      - name: Collect changed official links
        id: urls
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff --name-only "origin/${BASE_REF}...HEAD" -- src/data/apps \
            | node scripts/extract-urls.mjs --changed > /tmp/urls.txt
          count=$(grep -c . /tmp/urls.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count changed URL(s) to check"
      # Accepting 403/429 is about bot mitigation, not about being lenient.
      # Seeding the catalogue put ~1 150 vendor URLs through here and 14 came
      # back 403 from sites that are plainly alive (winehq.org, dolphin-emu.org,
      # rpcs3.net, gitlab.com, MSI, Nexus Mods, Epic, Enpass). A checker that
      # cries wolf on a seventh of the catalogue teaches everyone to ignore it,
      # which costs more than the 403 it would one day be right about.
      # 404/500/connection failures — the codes that actually mean "gone" —
      # still fail the build.
      #
      # Do NOT add `--user-agent`. Spoofing a browser was tried and made things
      # worse, not better: it cleared the 403s but gitlab.gnome.org started
      # answering 406 and whatsapp.com 400, both of which pass fine on lychee's
      # default agent. There is no single UA every vendor is happy with, so the
      # status-code accepts carry this on their own.
      #
      # Skipped when the PR changes no app data — lychee treats an empty input
      # as a configuration error and fails. A code-only PR legitimately has
      # zero URLs to check. Skipping rather than `failIfEmpty: false` keeps the
      # zero visible: a skipped step is obvious in the checks list, whereas a
      # green "0 links" is exactly the kind of quiet pass this repo keeps
      # getting caught by.
      - name: Link check
        if: github.event_name == 'pull_request' && steps.urls.outputs.count != '0'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --max-concurrency 4 --retry-wait-time 5 --max-retries 4 --timeout 45
            --accept '200..=299,403,429'
            /tmp/urls.txt

  # docs/12 §2 — SonarQube Cloud, CI-based analysis (sonar-project.properties).
  # Deliberately NOT a required check: a Sonar outage must never block a
  # merge, and a failing quality gate still turns this job red on the PR
  # (`sonar.qualitygate.wait`).
  #
  # The `if:` may only read the `github` context. A `secrets` reference there
  # makes the WHOLE workflow invalid — and then `build` and `gates`, which are
  # required, never appear. Runs that would lack SONAR_TOKEN are skipped
  # instead: Dependabot (its secrets are a separate store), pull requests from
  # forks, and the bot data PRs that quarantine.yml / vt-recheck.yml dispatch
  # CI on (`workflow_dispatch`, or `pull_request` runs a maintainer approves).
  sonar:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Blame and the new-code period come from history: a shallow clone
          # makes Sonar attribute old lines to the latest commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same unit run as the build job's; Sonar reads coverage/lcov.info.
      - name: Unit tests (coverage report)
        run: pnpm coverage
      # "Previous version" is this project's new-code period, so each analysis
      # carries package.json's version: new code on main is then everything
      # since the last release instead of everything since the first scan.
      - name: Project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # scannerVersion pins the newest SonarScanner CLI (the action's default
      # trails it); the action verifies the download's signature.
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: 8.2.0.6438
          args: >-
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.qualitygate.wait=true
