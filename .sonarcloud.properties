# SonarCloud automatic analysis (project poli0981_softharbor).
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/
#
# Sources stay rooted at the repo so workflow files under .github/ keep being
# analysed (the githubactions rules found unpinned actions there). Tests are
# split out so test files are judged by test rules, and the curated dataset is
# excluded: it is CC BY-SA content validated by Zod + validate:data, not code.
sonar.sources=.
sonar.tests=.
sonar.exclusions=src/data/**,data/**,docs/**,dist/**,coverage/**,node_modules/**,**/*.test.ts,**/*.test.mjs,e2e/**
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs,e2e/**
sonar.cpd.exclusions=src/data/**,src/i18n/**
