# Supply-chain gate (docs/09 §7).
#
# pnpm >= 10 blocks dependency install scripts by default; each one must be
# decided here explicitly. pnpm 11 moved this out of package.json's "pnpm"
# field into this file and renamed it to `allowBuilds` — putting it in
# package.json is silently ignored with a warning (found in spike S1).
#
# Flipping any entry to true requires a decision-log line.

allowBuilds:
  # Native binary for the Vite/Astro toolchain. The build cannot run without it.
  esbuild: true
  # Downloads the lefthook binary that installs our git hooks (docs/10 §4).
  lefthook: true
  # Cloudflare's local Worker runtime, pulled in by wrangler. Its postinstall
  # (install.js) only verifies or re-fetches the binary, which already arrives
  # as the platform optionalDependency (@cloudflare/workerd-<os>-<arch>), so
  # `wrangler dev` runs the /api/verify Worker (D25) without it — checked
  # 2026-10-21. The Worker's tests run under Node (vitest). False is a
  # decision, not an oversight.
  workerd: false

# Security overrides. Every package here reaches us only through BUILD or DEV
# tooling — the eslint toolchain or @astrojs/check's language server; nothing
# here ships to a visitor. Each floor is the first release that fixes every
# advisory listed. Remove a line once upstream's own range moves past it
# (`pnpm why <pkg>` shows who still pins the old version).
#
# minimatch — GHSA-g3hv-75wg-m249 (<11.0.1). Callers: eslint, @eslint/config-array
# and typescript-eslint (`^10.2.x`, matching our own config globs against our
# own paths). No patched 10.x exists, so 11 is forced across a major;
# acceptable only because every caller uses nothing 11 removed — `minimatch()`,
# `minimatch.match()` and `new Minimatch().match()`, never makeRe/regexp/AST/
# debug — and `pnpm lint` lints the same 157 files with the same result either
# side of the override (checked 2026-11-04). Every 11.x requires
# brace-expansion ^5.0.12, which retired that package's own floor
# (GHSA-mh99-v99m-4gvg … GHSA-q2hr-2g5m-vwhr, <5.0.12).
#
# fast-uri — GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
# GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp, GHSA-qw65-cvwx-89v3 (<3.1.7) and
# GHSA-hrr3-gc8f-f4qj (<3.1.8). Same major as ajv@8's `^3.0.1` range; pnpm kept
# the locked 3.1.4 even under `update --depth Infinity`, hence the override.
#
# (Retired 2026-11-09 with @vite-pwa/astro 2, which drops workbox-build 7 and
# its 270-odd packages: `glob` ^14.0.2 — GHSA-3g3m-2fjr-6pw4, nothing depends
# on glob any more — and `serialize-javascript` ^7.1.3 — GHSA-m5mm-p8h7-m29v,
# @vite-pwa/workbox-build 8 asks for ^7.1.4 itself. Retired 2026-11-04:
# `miniflare>undici` — miniflare pins the fixed 7.30.1 itself.)
overrides:
  minimatch: '^11.0.1'
  fast-uri: '^3.1.9'

# Advisories that NO release fixes yet, so no override can reach them. CI's
# `pnpm audit --prod` skips exactly these ids; `osv-scanner.toml` lists the same
# ids for OSV-Scanner, with an expiry date and the reasoning. Remove a line (in
# both files) once a fixed release exists — then it becomes an override above.
#
# deepmerge <= 4.3.1 — GHSA-gcqx-w48m-w2h4 (low). Build tooling only, merging
# our own config: @astrojs/svelte -> @sveltejs/vite-plugin-svelte (the
# @vite-pwa/astro -> workbox-build 7 path left with @vite-pwa/astro 2).
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4

# @astrojs/astro2tsx 0.1.3 (astro check's .astro -> TSX step, a wasm module)
# pins @emnapi/core 1.11.3 but leaves @emnapi/runtime to the peer range of
# @napi-rs/wasm-runtime (`^1.7.1 || ^2.0.0-alpha.4`). Since rolldown 1.3.0
# (astro 7.4.7) brought @emnapi/runtime 2.0.0-beta.2 into the graph, pnpm
# resolves that peer to the beta; core 1.x with runtime 2.x throws "this.bridge
# .setLastError is not a function" on import, and `astro check` reports the
# failed import as "@astrojs/check is not installed" (Dependabot #67,
# 2026-11-09). Give astro2tsx the runtime that matches its core. Drop this once
# an astro2tsx release declares @emnapi/runtime itself.
packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': '1.11.3'
