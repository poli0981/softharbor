# Supply-chain gate (docs/09 §7).
#
# pnpm >= 10 blocks dependency install scripts by default; each one must be
# decided here explicitly. pnpm 11 moved this out of package.json's "pnpm"
# field into this file and renamed it to `allowBuilds` — putting it in
# package.json is silently ignored with a warning (found in spike S1).
#
# Flipping any entry to true requires a decision-log line.

allowBuilds:
  # Native binary for the Vite/Astro toolchain. The build cannot run without it.
  esbuild: true
  # Downloads the lefthook binary that installs our git hooks (docs/10 §4).
  lefthook: true
  # Cloudflare's local Worker runtime, pulled in by wrangler. SoftHarbor ships
  # pure static assets and never runs a Worker locally (docs/01 §1), so this
  # binary is dead weight. False is a decision, not an oversight.
  workerd: false

# Security overrides. Both packages reach us only through
# @vite-pwa/astro -> vite-plugin-pwa -> workbox-build, i.e. BUILD tooling;
# nothing here ships to a visitor. Each floor is the first release that fixes
# every advisory listed. Remove a line once upstream's own range moves past it
# (`pnpm why <pkg>` shows who still pins the old version).
#
# brace-expansion — GHSA-mh99-v99m-4gvg (<5.0.8), GHSA-rgw5-rvv9-x895 (<5.0.9),
# GHSA-6j4f-fj2g-mc7p (<5.0.10), GHSA-qhr7-859c-m2p7 (<5.0.11),
# GHSA-q2hr-2g5m-vwhr (<5.0.12). No patched 2.x exists, so minimatch@5 is forced
# across a three-major gap; acceptable only because the package's surface is a
# single `expand()` function and the build plus full test suite run against it.
#
# fast-uri — GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
# GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp, GHSA-qw65-cvwx-89v3 (<3.1.7) and
# GHSA-hrr3-gc8f-f4qj (<3.1.8). Same major as ajv@8's `^3.0.1` range; pnpm kept
# the locked 3.1.4 even under `update --depth Infinity`, hence the override.
overrides:
  brace-expansion: '^5.0.12'
  fast-uri: '^3.1.9'

# @vite-pwa/astro 1.2.0 is the latest release (2025-11) and its peer range stops
# at Astro 5. It works on Astro 7 — `pnpm build` and `check:sw` exercise the
# generated service worker on every CI run — so the mismatch is accepted
# explicitly here instead of surfacing as an unexplained install warning.
peerDependencyRules:
  allowedVersions:
    '@vite-pwa/astro>astro': '7'
