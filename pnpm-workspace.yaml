# Supply-chain gate (docs/09 §7).
#
# pnpm >= 10 blocks dependency install scripts by default; each one must be
# decided here explicitly. pnpm 11 moved this out of package.json's "pnpm"
# field into this file and renamed it to `allowBuilds` — putting it in
# package.json is silently ignored with a warning (found in spike S1).
#
# Flipping any entry to true requires a decision-log line.

allowBuilds:
  # Native binary for the Vite/Astro toolchain. The build cannot run without it.
  esbuild: true
  # Downloads the lefthook binary that installs our git hooks (docs/10 §4).
  lefthook: true
  # Cloudflare's local Worker runtime, pulled in by wrangler. SoftHarbor ships
  # pure static assets and never runs a Worker locally (docs/01 §1), so this
  # binary is dead weight. False is a decision, not an oversight.
  workerd: false

# Security override — GHSA-mh99-v99m-4gvg (CVSS 7.5) affects brace-expansion
# <5.0.8, and no patched 2.x exists. It reaches us only through
# @vite-pwa/astro -> vite-plugin-pwa -> workbox-build -> ... -> minimatch@5,
# i.e. BUILD tooling; nothing here ships to a visitor. Forcing 5.x across a
# three-major gap is only acceptable because the package's surface is a single
# `expand()` function — and because the build and full test suite are run
# against it below. Remove once upstream moves.
overrides:
  brace-expansion: '^5.0.8'
