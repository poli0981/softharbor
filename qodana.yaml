# Qodana (JetBrains) — the third analyser beside CodeQL and SonarQube Cloud
# (D35, docs/12 §2). Read by .github/workflows/qodana.yml; results go to Qodana
# Cloud (the QODANA_TOKEN project token carries the Ultimate licence) and to
# GitHub code scanning (tool QDJS, category softharbor/qodana).
version: '1.0'

# Qodana for JS is WebStorm's engine and runs only under an Ultimate (or
# Ultimate Plus) licence. Native mode, no container: the analysis then sees the
# runner's Node 26 and the node_modules that pnpm installed in the step before
# it, instead of whatever Node the image ships. On its own it reads
# .ts/.js/.mjs, JSON, YAML, Markdown and CSS; the plugin below adds .astro.
linter: qodana-js
withinDocker: 'false'

profile:
  name: qodana.recommended
  inspections:
    # Under the Astro plugin every component an .astro frontmatter imports and
    # its template uses reads as unused (75 of 75 findings on the first run
    # with the plugin). ESLint's @typescript-eslint/no-unused-vars, through
    # eslint-plugin-astro's parser, sees template use and checks those imports.
    - inspection: ES6UnusedImports
      ignore:
        - 'scope#file:*.astro'

# The same scope as sonar-project.properties: the dataset is CC BY-SA content
# validated by Zod and validate:data, not code; everything else here is
# generated output or local tool state (git-ignored, so absent in CI anyway).
exclude:
  - name: All
    paths:
      - src/data
      - data
      - dist
      - coverage
      - playwright-report
      - test-results
      - blob-report
      - .astro
      - .wrangler
      - .claude
  # The dark palette has to exist twice — once for the system choice
  # (`@media (prefers-color-scheme: dark)`), once for the explicit one
  # (`[data-theme='dark']`): CSS cannot share one block between a media query
  # and a selector. `light-dark()` could, but needs Chrome 123 / Safari 17.5,
  # newer than Tailwind 4's own floor (Chrome 111, Safari 16.4).
  - name: DuplicatedCode
    paths:
      - src/styles/global.css

# JetBrains' own Astro plugin (installed from the Marketplace on each run), so
# the 52 .astro files are inspected too — qodana-js alone skips them. Its one
# false-positive class is scoped out above. The Svelte plugin
# (dev.blachut.svelte.lang) was tried and dropped: on unchanged code it
# reported Intl.PluralRules#select and Intl.NumberFormat#format in
# ShFilterSheet.svelte as unresolved in one run of three. A gate that flips
# on its own teaches everyone to ignore it; the six islands stay covered by
# eslint-plugin-svelte, their Vitest suites and the e2e run.
plugins:
  - id: org.jetbrains.plugins.astro

# Any finding fails the job: red on the PR, but not a required check (D35) —
# like Sonar's gate, a Qodana Cloud outage must never block a merge.
failureConditions:
  severityThresholds:
    any: 0
