# SonarQube Cloud, CI-based analysis (docs/12 §2). Read by the scanner in
# ci.yml's `sonar` job; Automatic Analysis is off for this project — it and a
# CI scan cannot both run, and only a CI scan can import coverage.
sonar.organization=poli0981
sonar.projectKey=poli0981_softharbor
sonar.projectName=SoftHarbor

# Sources stay rooted at the repo so workflow files under .github/ keep being
# analysed (the githubactions rules found unpinned actions there). Tests are
# split out so test files are judged by test rules — scripts/fixture.ts is the
# scripts' test kit, not shipped code — and the curated dataset is excluded:
# it is CC BY-SA content validated by Zod + validate:data, not code.
sonar.sources=.
sonar.tests=.
sonar.exclusions=src/data/**,data/**,docs/**,dist/**,coverage/**,node_modules/**,**/*.test.ts,**/*.test.mjs,e2e/**,scripts/fixture.ts
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs,e2e/**,scripts/fixture.ts
sonar.cpd.exclusions=src/data/**,src/i18n/**

# Written by `pnpm coverage` (vitest.config.ts). Sonar indexes no .svelte or
# .astro file, so the islands' lcov entries are reported as unresolved and
# skipped; every analysed .ts/.js/.mjs file is measured. The only exclusions
# are the root toolchain configs — read by the tools themselves, not
# unit-testable logic.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=*.config.ts,*.config.js,*.config.mjs
